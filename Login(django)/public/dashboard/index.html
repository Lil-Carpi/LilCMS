<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="../assets/js/dash.js" defer></script>
    <title>Mi Dashboard SPA</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; background: #f4f4f9; }
        .tarjeta { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: none; }
        .btn-salir { color: white; background: red; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        #mensaje-carga { font-size: 18px; color: #555; }
    </style>
</head>
<body>

    <div id="mensaje-carga">Verificando tu sesión...</div>

    <div class="tarjeta" id="contenido-protegido">
        <h1 id="titulo-bienvenida"></h1>
        <p>Estás logueado con el correo: <strong id="correo-usuario"></strong></p>
        <br><br>
        <button id="btn-logout" class="btn-salir">Cerrar Sesión</button>
    </div>


</body>
</html>
