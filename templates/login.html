{% extends 'base.html' %}
{% block title %}Login - LilCMS{% endblock %}
{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <h1>LilCMS</h1>
            <p>Welcome back!</p>
        </div>
        <form action="" method="post">
            {% csrf_token %}

            {% if error_message %}
            <div style="color:var(--danger); font-size: 0.9rem; margin-bottom: 1rem; font-weight: 600;">
                {{ error_message }}
            </div>
            {% endif %}
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="admin@lilcms.com" required autocomplete="email">
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="········" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
